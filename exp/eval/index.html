<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';base-uri 'none';form-action 'none'">
<title>完成動画の採点票（実験）</title>
<style>body{margin:0;background:#0f131c;color:#e8eaf0;font:14px/1.6 system-ui,sans-serif;padding:14px}h1{font-size:18px}h2{font-size:15px;margin-top:18px}.note{color:#aab3c8;font-size:12px;white-space:pre-wrap}.w{color:#ffb454}.bad{color:#eb7b7b}.ok{color:#7bdc9a}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #2a3042;padding:6px 4px;text-align:center}td:first-child,th:first-child{text-align:left}
input[type=number]{width:56px;background:#12141b;color:#e8eaf0;border:1px solid #3a4260;border-radius:6px;padding:6px;font-size:16px}select{background:#12141b;color:#e8eaf0;border:1px solid #3a4260;border-radius:6px;padding:6px}
button{background:#232a3d;color:#e8eaf0;border:1px solid #3a4260;border-radius:8px;padding:10px 14px;font-size:14px}textarea{width:100%;min-height:150px;background:#12141b;color:#e8eaf0;border:1px solid #3a4260;border-radius:8px;padding:8px;box-sizing:border-box}</style></head><body>
<h1>完成動画の採点票（100点満点・品質目標90点以上）</h1>
<p class="note">CINEMATIC PRO の「ブラインド比較セット」で書き出した動画P・Q・Rを、順不同で見て採点します。A/B/Cとの対応は採点が終わるまで見ないでください。\n著作権・規約・セキュリティが「合格」でない動画は、点数に関係なく公開不可です（未確認も公開不可）。\n点数は実素材・実音源の完成動画を見た評価だけに使います（模擬素材の動画は採点対象外）。</p>
<table id="t"></table>
<h2>公開の前提確認（動画ごと）</h2><table id="g"></table>
<h2>結果</h2><div id="res" class="note"></div>
<h2>答え合わせ（採点後）</h2>
<p class="note">CINEMATIC PRO の「答え合わせ」に表示された対応を選びます。</p><p id="map"></p><button id="rv">対応を反映して集計</button><div id="sum" class="note"></div>
<h2>記録用テキスト（台帳のイベントに貼る）</h2><textarea id="out" readonly></textarea>
<script>
const $=id=>document.getElementById(id),V=['P','Q','R'],C=[['映像美',20],['台本と映像の一致',15],['冒頭の引き込み',15],['ナレーション',15],['BGM・効果音',10],['編集テンポ',10],['字幕・文字演出',10],['独自性',5]],G=['著作権','規約','セキュリティ'];
let ST={s:{},g:{},m:{}};try{ST=Object.assign(ST,JSON.parse(localStorage.getItem('evalSheet')||'{}'))}catch{}
const save=()=>{try{localStorage.setItem('evalSheet',JSON.stringify(ST))}catch{}};
function el(t,txt,p){const e=document.createElement(t);if(txt!=null)e.textContent=txt;if(p)p.appendChild(e);return e}
function clampScore(v,max){const n=Math.round(Number(v));return Number.isFinite(n)?Math.max(0,Math.min(max,n)):0}
function total(v){return C.reduce((q,c,i)=>q+clampScore((ST.s[v]||{})[i]||0,c[1]),0)}
function scored(v){return C.every((c,i)=>(ST.s[v]||{})[i]!==undefined&&(ST.s[v]||{})[i]!=='')}
function gateOk(v){return G.every((x,i)=>(ST.g[v]||{})[i]==='合格')}
function verdict(v){if(!scored(v))return{t:'未評価（採点前または採点途中）',c:'w'};const T=total(v),q=T>=90;if(!gateOk(v))return{t:T+'点（採点済み）｜公開不可（著作権・規約・セキュリティの合格が揃っていません）',c:'bad'};return q?{t:T+'点（採点済み）｜品質目標達成・公開可（最終承認はオーナー）',c:'ok'}:{t:T+'点（採点済み）｜品質目標（90点）未達。改善が必要',c:'w'}}
function build(){const t=$('t');t.textContent='';let h=el('tr',null,t);el('th','項目（配点）',h);V.forEach(v=>el('th','動画'+v,h));
 C.forEach((c,i)=>{const r=el('tr',null,t);el('td',c[0]+'（'+c[1]+'点）',r);V.forEach(v=>{const d=el('td',null,r),inp=el('input',null,d);inp.type='number';inp.min=0;inp.max=c[1];inp.step=1;inp.inputMode='numeric';inp.id='s'+v+i;const cur=(ST.s[v]||{})[i];if(cur!==undefined)inp.value=cur;
  inp.oninput=()=>{ST.s[v]=ST.s[v]||{};if(inp.value===''){delete ST.s[v][i]}else{const n=clampScore(inp.value,c[1]);ST.s[v][i]=n;if(String(n)!==inp.value)inp.value=n}save();calc()}})});
 const g=$('g');g.textContent='';h=el('tr',null,g);el('th','項目',h);V.forEach(v=>el('th','動画'+v,h));
 G.forEach((x,i)=>{const r=el('tr',null,g);el('td',x,r);V.forEach(v=>{const d=el('td',null,r),s=el('select',null,d);s.id='g'+v+i;['未確認','合格','不合格'].forEach(o=>{const op=el('option',o,s);op.value=o});s.value=(ST.g[v]||{})[i]||'未確認';s.onchange=()=>{ST.g[v]=ST.g[v]||{};ST.g[v][i]=s.value;save();calc()}})});
 const m=$('map');m.textContent='';V.forEach(v=>{el('span','動画'+v+' = ',m);const s=el('select',null,m);s.id='m'+v;['','A','B','C'].forEach(o=>{const op=el('option',o||'未選択',s);op.value=o});s.value=ST.m[v]||'';s.onchange=()=>{ST.m[v]=s.value;save()};el('span','　',m)})}
function calc(){const r=$('res');r.textContent='';V.forEach(v=>{const x=verdict(v),d=el('div','動画'+v+': '+x.t,r);d.className=x.c});
 $('out').value=V.map(v=>'動画'+v+' '+(scored(v)?'合計'+total(v)+'点':'未評価')+'（'+C.map((c,i)=>c[0]+((ST.s[v]||{})[i]??'-')+'/'+c[1]).join('、')+'）｜著作権'+((ST.g[v]||{})[0]||'未確認')+'・規約'+((ST.g[v]||{})[1]||'未確認')+'・セキュリティ'+((ST.g[v]||{})[2]||'未確認')+'｜'+verdict(v).t).join('\n')}
function reveal(){const used=V.map(v=>ST.m[v]).filter(Boolean),s=$('sum');s.textContent='';if(used.length<3||new Set(used).size<3){s.textContent='P・Q・RにA・B・Cを1つずつ選んでください';s.className='note w';return null}
 s.className='note';const rows=V.map(v=>({v,k:ST.m[v],T:total(v),ok:scored(v)})).sort((a,b)=>a.k<b.k?-1:1);
 rows.forEach(r=>el('div',r.k+'案（動画'+r.v+'）: '+(r.ok?r.T+'点':'未評価')+'｜'+C.map((c,i)=>c[0]+((ST.s[r.v]||{})[i]??'-')).join('／'),s));
 if(rows.every(r=>r.ok)){const best=rows.slice().sort((a,b)=>b.T-a.T);el('div','最高点: '+best[0].k+'案（'+best[0].T+'点）'+(best[0].T===best[1].T?'｜同点があります。冒頭の引き込みと編集テンポの合計で比べてください':'')+'｜この結果は1回・少人数の評価です。判断は複数本で確認してください',s)}
 $('out').value+='\n\n【答え合わせ】'+rows.map(r=>r.k+'案=動画'+r.v+' '+r.T+'点').join('、');return rows}
$('rv').onclick=reveal;build();calc();window.EV={total,verdict,reveal,clampScore,ST};
</script></body></html>
