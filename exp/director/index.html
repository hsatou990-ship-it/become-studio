<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' 'unsafe-inline';style-src 'unsafe-inline';connect-src 'none';base-uri 'none';form-action 'none'">
<title>AI DIRECTOR（実験・本体に影響なし）</title>
<style>body{font:15px/1.6 system-ui,sans-serif;background:#10131a;color:#e8eaf0;margin:0;padding:14px;max-width:680px;margin:auto}h1{font-size:18px}h2{font-size:15px;margin:18px 0 6px;color:#d4af37}button,select,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #39435a;background:#1b2130;color:#e8eaf0;width:100%;margin:4px 0;box-sizing:border-box}textarea{min-height:140px}.note{color:#9aa4b8;font-size:13px}.card{background:#0b0e14;border:1px solid #2a3140;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:#222a3a;margin:2px 4px 2px 0;font-size:12px}.adv{color:#ffb86b}canvas{width:100%;background:#0b0e14;border-radius:8px}</style></head><body>
<h1>AI DIRECTOR（実験）</h1>
<p class="note">台本から、感情の流れ・場面数・長さ・カメラ・つなぎ・色・字幕の強調・音を設計します。場面数は台本ごとに変わります。辞書とルールによる試作で、感情の判定は【推測】です。通信なし。</p>
<textarea id="sc">夜明け前の暗闇で、誰も見ていない努力を続ける
何度も失敗して、孤独に心が折れそうになる
それでも一歩だけ前に進むと決めた
やがて朝日が昇り、景色が変わる</textarea>
<select id="tg"><option value="0">目標の長さ：指定しない</option><option value="15">15秒</option><option value="30">30秒</option><option value="60">60秒</option><option value="90">90秒</option></select>
<button id="go">演出を設計する</button><button id="re">別案を出す</button>
<canvas id="cv" width="640" height="160"></canvas><div id="meta"></div><div id="out"></div>
<script src="director.js"></script>
<script>
const $=i=>document.getElementById(i);let variant=0;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function draw(P){const c=$('cv'),x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);const T=P.meta.totalSec||1;
 x.strokeStyle='#2a3140';x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();
 P.scenes.forEach(s=>{const x0=s.start/T*W,w=s.dur/T*W;x.fillStyle=s.grade==='cold-teal'?'rgba(80,140,170,.25)':s.grade==='warm-gold'?'rgba(212,175,55,.25)':'rgba(150,150,150,.15)';x.fillRect(x0,0,w-1,H);x.fillStyle='#9aa4b8';x.font='11px sans-serif';x.fillText(s.role,x0+3,12)});
 x.strokeStyle='#d4af37';x.lineWidth=2;x.beginPath();P.scenes.forEach((s,i)=>{const px=(s.start+s.dur/2)/T*W,py=H/2-s.emotion.v*(H/2-14);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
 x.strokeStyle='#6fdc8c';x.lineWidth=1;x.beginPath();P.scenes.forEach((s,i)=>{const px=(s.start+s.dur/2)/T*W,py=H-6-s.emotion.a*(H-24);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function run(){const P=DIR.plan($('sc').value,{target:+$('tg').value,variant});window.LASTPLAN=P;
 if(!P.scenes.length){$('meta').textContent=P.meta.error;$('out').innerHTML='';return}
 draw(P);$('meta').innerHTML='<p class="note">金線=感情の明暗　緑線=強さ　／　全体 約'+P.meta.totalSec+'秒・'+P.scenes.length+'場面・テンポ'+P.meta.bpm+'BPM（文字速度は毎秒'+P.meta.cps+'字と仮定）</p>'+P.meta.advice.map(a=>'<div class="adv">⚠ '+esc(a)+'</div>').join('');
 $('out').innerHTML=P.scenes.map(s=>'<div class="card"><b>'+(s.i+1)+'. '+esc(s.role)+'</b>　'+s.start+'〜'+(s.start+s.dur).toFixed(1)+'秒<br>'+esc(s.text)+'<br><span class="tag">カメラ '+esc(s.camera)+'</span><span class="tag">つなぎ '+esc(s.transition)+'</span><span class="tag">速度 '+esc(s.speed)+'</span><span class="tag">色 '+esc(s.grade)+'</span>'+(s.emphasis.length?'<span class="tag">強調 '+s.emphasis.map(esc).join('・')+'</span>':'')+(s.sfx.length?'<span class="tag">音 '+s.sfx.map(q=>esc(q.kind)).join('・')+'</span>':'')+'<br><span class="note">素材検索語: '+s.queries.map(esc).join(', ')+'</span></div>').join('')}
$('go').onclick=()=>{variant=0;run()};$('re').onclick=()=>{variant++;run()};run();
</script></body></html>
